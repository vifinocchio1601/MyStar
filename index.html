<style>
/* Layout : une loge de concert la nuit. Colonne unique pour le téléphone, en-tête collant, dock du bas avec le bouton de semaine. Look sombre assumé (scène). */
:root {
  --bg: #17131f; --surface: #221c2d; --raise: #2c2539; --line: #3a3149;
  --fg: #f3ece2; --muted: #a99fb6; --amber: #f0a33c; --amber-ink: #241606;
  --rose: #e4688a; --good: #74c69d; --bad: #ef7461;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app { max-width: 560px; margin: 0 auto; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; touch-action: manipulation; }
input { font-size: 16px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; outline: none; }
input:focus { border-color: var(--amber); }
button { cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .42; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Départ */
.setup { display: flex; flex-direction: column; gap: 14px; padding-block: 40px 60px; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 10vw, 52px); line-height: .98; letter-spacing: -.02em; }
.lead { margin: 0; color: var(--muted); max-width: 60ch; }
.lbl { display: block; margin: 6px 0 -6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
.chip.sel { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 700; }
.cta { width: 100%; padding: 14px; border-radius: 12px; background: var(--amber); color: var(--amber-ink); font-weight: 700; font-size: 16px; }
.cta.ghost { background: var(--raise); color: var(--fg); }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.r1 { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.who { min-width: 0; }
.who h1 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tier span { display: inline-block; padding: 6px 10px; border: 1.5px dashed var(--amber); color: var(--amber); border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.m { background: var(--surface); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.m .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.m b { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.neg { color: var(--bad); }
.vu { display: flex; gap: 2px; align-items: flex-end; height: 18px; margin-top: 2px; }
.vu i { flex: 1; height: 100%; border-radius: 2px; background: var(--line); }
.vu i.on { background: var(--good); } .vu i.warm { background: var(--amber); } .vu i.hot { background: var(--rose); }
.prog { height: 4px; background: var(--surface); border-radius: 4px; overflow: hidden; }
.prog div { height: 100%; background: linear-gradient(90deg, var(--rose), var(--amber)); }
.nexttier { margin: -4px 0 0; font-size: 12px; color: var(--muted); }

/* Contenu */
main { padding-block: 6px 170px; display: flex; flex-direction: column; gap: 10px; }
main h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin-top: 14px; }
.act { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.act .txt { min-width: 0; }
.act h3 { font-size: 16px; font-weight: 700; }
.act p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.go { flex: none; min-width: 104px; padding: 10px 12px; border-radius: 10px; background: var(--amber); color: var(--amber-ink); font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.go span { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.go em { font-style: normal; font-size: 10.5px; font-weight: 600; }
.go:disabled { background: var(--raise); color: var(--muted); opacity: 1; }
.panel { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel input { background: var(--bg); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint.top { margin-top: 10px; }
.trend { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--rose) 16%, var(--bg)); font-size: 13px; }
.trend b { color: var(--rose); }

.tracks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.song { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.sh { display: flex; gap: 12px; align-items: flex-start; }
.sh > div { min-width: 0; }
.len { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 4px; flex: none; width: 36px; }
.song h3 { font-family: var(--display); font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.song p { margin: 3px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.pill.w { background: var(--raise); color: var(--fg); }
.pill.r { background: color-mix(in srgb, var(--amber) 22%, var(--bg)); color: var(--amber); }
.pill.o { background: color-mix(in srgb, var(--good) 20%, var(--bg)); color: var(--good); }
.sb { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 48px; }
.streams { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.sm { padding: 8px 12px; border-radius: 10px; background: var(--raise); font-weight: 600; font-size: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; }
.sm small { font-size: 11px; color: var(--muted); font-weight: 500; }
.sm.hl { background: var(--amber); color: var(--amber-ink); }
.sm.hl small { color: var(--amber-ink); opacity: .75; }
.sm.danger { background: var(--bad); color: #1d0a06; }
.two { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
.two > div { min-width: 0; }
.err { color: var(--bad); font-weight: 600; }
.dim h3, .dim p { color: var(--muted); }
.go.off { background: var(--raise); color: var(--good); }
.go.off em { color: var(--muted); }
.here { flex: none; font-size: 12px; font-weight: 700; color: var(--good); text-transform: uppercase; letter-spacing: .06em; }
.pos { color: var(--amber); }
.cert { color: #e8c35a; } .cert.c2 { color: #cfd6e2; } .cert.c3 { color: #9fe3f0; }
.chart { list-style: none; margin: 0; padding: 0; }
.chart li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.chart li > b { font-family: var(--mono); font-size: 15px; color: var(--muted); text-align: right; }
.chart li div { min-width: 0; display: flex; flex-direction: column; }
.chart li span { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart li small { font-size: 12px; color: var(--muted); }
.chart li.me { background: color-mix(in srgb, var(--amber) 14%, var(--bg)); border-radius: 8px; }
.chart li.me > b, .chart li.me span { color: var(--amber); }
.mv { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mv.up { color: var(--good); } .mv.dn { color: var(--bad); } .mv.new { color: var(--rose); font-weight: 700; }
.buzz { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.buzz b.up { color: var(--good); } .buzz b.dn { color: var(--bad); }
.soc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.soc div { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.soc span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.soc b { font-family: var(--mono); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.sbar.big { height: 10px; background: var(--bg); }
.ft { font-family: var(--body); font-size: 13px; color: var(--rose); font-weight: 600; }
.sm2 { font-size: 22px; color: var(--fg); }
.flist { display: flex; flex-direction: column; gap: 6px; }
.frow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: var(--raise); border-radius: 10px; text-align: left; }
.frow span { display: flex; flex-direction: column; min-width: 0; }
.frow small { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.frow em { font-style: normal; font-size: 12px; color: var(--amber); white-space: nowrap; }
.fd { color: var(--amber); }
.quest { margin-top: 12px; padding: 14px; border-radius: 14px; border: 1.5px dashed var(--amber); display: flex; flex-direction: column; gap: 4px; }
.quest h3 { font-family: var(--display); font-size: 19px; font-weight: 600; }
.quest p:last-child { margin: 0; font-size: 13px; color: var(--muted); }
.gig { align-items: center; text-align: center; }
.gstage { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.tap { position: relative; width: 210px; height: 210px; max-width: 70vw; max-height: 70vw; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--rose) 30%, var(--surface)) 0%, var(--surface) 70%); display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.tap .core { position: absolute; width: 46%; height: 46%; border-radius: 50%; border: 3px solid var(--amber); }
.tap .ring { position: absolute; width: 46%; height: 46%; border-radius: 50%; border: 3px solid var(--rose); opacity: 0; will-change: transform; }
.tap b { position: relative; font-family: var(--mono); font-size: 14px; color: var(--muted); }
.tap.hit .core { animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(1.18); background: color-mix(in srgb, var(--amber) 40%, transparent); } to { transform: none; } }
.gjudge { margin: 0; min-height: 1.4em; font-family: var(--display); font-weight: 800; font-size: 22px; }
.gjudge.perfect { color: var(--amber); } .gjudge.ok { color: var(--good); } .gjudge.miss { color: var(--bad); }
#gres { display: flex; flex-direction: column; gap: 10px; width: 100%; }
#gres:empty { display: none; }
.frow.on { background: color-mix(in srgb, var(--amber) 22%, var(--surface)); }
.frow.on em { color: var(--good); }
.cities { display: flex; flex-direction: column; gap: 8px; }
.city { padding: 10px; border-radius: 10px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.city.on { outline: 1.5px solid var(--amber); }
.ch { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ch small { color: var(--muted); font-size: 12px; }
.cv { display: flex; flex-wrap: wrap; gap: 6px; }
.vch { padding: 6px 10px; border-radius: 8px; background: var(--raise); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: flex-start; }
.vch small { font-size: 11px; color: var(--muted); font-weight: 500; }
.vch.sel { background: var(--amber); color: var(--amber-ink); } .vch.sel small { color: var(--amber-ink); }
.tn { font-family: var(--display); font-size: 18px; font-weight: 600; }
.dates { list-style: none; margin: 0; padding: 0; }
.dates li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.dates small { color: var(--muted); font-size: 12px; } .dates b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); }
.dates li.done span { color: var(--muted); text-decoration: line-through; } .dates li.done b { color: var(--good); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-top: 10px; }
.cd { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cd b { font-size: 11px; text-align: center; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.cd.free b { color: var(--good); }
.cs { height: 34px; border-radius: 5px; background: var(--surface); font-size: 9.5px; line-height: 1.1; padding: 3px; overflow: hidden; color: var(--amber-ink); font-weight: 600; word-break: break-word; }
.cs:nth-child(4) { background: color-mix(in srgb, var(--surface) 70%, #000); }
.cs.on { background: var(--amber); } .cs.fx { background: var(--rose); color: #23060f; }
.offer { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 12px; border-radius: 12px; background: var(--bg); }
.offer span { color: var(--muted); font-size: 13px; } .offer b { font-family: var(--mono); font-size: 18px; color: var(--amber); }
.empty { padding: 16px 0; color: var(--muted); font-size: 14px; }

.venue { padding: 14px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.venue.lock { background: transparent; border: 1px dashed var(--line); }
.venue.lock h3, .venue.lock p { color: var(--muted); }
.vh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.vh h3 { font-family: var(--display); font-weight: 600; font-size: 18px; }
.cap { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.venue p { margin: 0; font-size: 13px; color: var(--muted); }
.req { color: var(--rose) !important; font-weight: 600; }
.vb { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

.stat { display: grid; grid-template-columns: 76px 1fr 32px; gap: 10px; align-items: center; font-size: 14px; }
.stat b { font-family: var(--mono); text-align: right; }
.sbar { height: 8px; background: var(--bg); border-radius: 8px; overflow: hidden; }
.sbar div { height: 100%; background: var(--amber); border-radius: 8px; }
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ladder li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0 9px 18px; border-bottom: 1px solid var(--line); position: relative; color: var(--muted); font-size: 14px; }
.ladder li::before { content: ""; position: absolute; left: 2px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; border: 1.5px solid var(--line); }
.ladder li.done { color: var(--fg); } .ladder li.done::before { background: var(--good); border-color: var(--good); }
.ladder li.cur { color: var(--amber); font-weight: 700; } .ladder li.cur::before { background: var(--amber); border-color: var(--amber); }
.ladder b { font-family: var(--mono); font-weight: 500; font-size: 12px; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.kv span { color: var(--muted); } .kv b { font-family: var(--mono); font-weight: 500; text-align: right; }
.journal { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.journal li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.journal span { font-family: var(--mono); color: var(--muted); flex: none; width: 38px; font-size: 12px; padding-top: 1px; }
.reset { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reset p { margin: 0; width: 100%; font-size: 14px; }

/* Dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock > * { max-width: 560px; margin-left: auto; margin-right: auto; }
.next { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border-radius: 12px; background: var(--rose); color: #23060f; font-weight: 800; font-size: 16px; font-family: var(--display); }
.next span { font-family: var(--body); font-size: 12px; font-weight: 600; opacity: .8; }
.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; padding: 8px 11px; border-radius: 8px; font-size: 13px; white-space: nowrap; font-weight: 600; color: var(--muted); }
.tabs button.on { color: var(--fg); background: var(--surface); }

/* Fenêtres */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(8, 5, 12, .72); display: flex; align-items: flex-end; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto; background: var(--surface); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: up .22s ease-out; }
.sheet.win { border: 2px solid var(--amber); }
.mh { font-family: var(--display); font-weight: 800; font-size: 34px; color: var(--amber); }
.rl { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.rl li { padding: 7px 0; border-bottom: 1px solid var(--line); }
.evt { margin: 0; font-size: 16px; line-height: 1.5; }
.ch { display: flex; flex-direction: column; gap: 8px; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
#toast { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 32px)); background: var(--fg); color: var(--bg); padding: 11px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>

function canDo(S, id) {
  const a = ACTIONS[id];
  if (a.cond && !a.cond(S)) return "hidden";
  if (a.ready && !a.ready(S)) return a.why ? a.why(S) : "Disponible dans " + S.teleCd + " sem.";
  if (S.energy < a.e) return "Pas assez d'énergie";
  if (a.cost && S.money < a.cost) return "Pas assez d'argent";
  return "";
}
function doAction(S, id) {
  if (canDo(S, id)) return null;
  const a = ACTIONS[id];
  S.energy -= a.e; if (a.cost) spend(S, a.cost);
  const m = a.run(S); log(S, m); return m;
}

}
function studios(S) {

function recordSong(S, id, st) {

}
function streamBase(S, s, mult) {

  return (S.fans * reach(S) + 250 + (s.feat ? s.feat.f * 0.6 : 0)) * Math.pow(s.note / 60, 2.2) * eraMult(S) * trend * (S.label ? 2.5 : 1) * mult;

function albumPool(S) { return S.songs.filter(s => s.note !== null && !s.alb); }
const PROMO = [{ n: "Sans promo", prix: 0, m: 1 }, { n: "Promo radio", prix: 2500, m: 1.5 }, { n: "Grosse campagne", prix: 15000, m: 2.2 }];

// ----- Concerts -----
function venueOk(S, v) { return S.fans >= v.min; }
function concert(S, vid, dates, perf) {
  perf = perf || 1;
  const v = VENUES.find(x => x.id === vid); dates = dates || 1;
  const e = gigE(S, dates > 1 ? 70 : v.e); const sc = sceneEff(S);
  if (!venueOk(S, v) || S.energy < e) return null;
  if (v.cout && S.money < v.cout * dates) return null;
  S.energy -= e; S.active = true; S.gigs = (S.gigs || 0) + 1; if (vid === "bar") S.flags.bar = true;

      f = a * (0.15 + sc / 300); r = a * v.prix * showMult(S) * perf * (has(S, "manager") ? 1.2 : 1) - v.cout;
      f *= showMult(S) * perf;
    } else {

      f = a * (S.voix + sc) / 200 * (v.type === "fest" ? 0.25 : 1.5) * perf;
      r = (v.cachet || 0) * (has(S, "manager") ? 1.2 : 1);

    aud += a; fg += f; net += r; S.gigAud += a;

  const sg = gain(S.scene, 25, S) * Math.min(dates, 2); S.scene = clamp(S.scene + sg, 0, 100);
  const what = dates > 1 ? `Tournée de ${dates} dates (${v.n})` : v.n;
  const pl = perf >= 1.2 ? "Show parfait. " : perf < 0.85 ? "Show raté. " : "";
  const m = `${pl}${what} : ${fmt(aud)} spectateurs, +${fmt(fg)} fans, ${net >= 0 ? "+" : "−"}${fmt(Math.abs(net))} €.`;
  log(S, m); return m;
}

function rollEvent(S) {

// ----- Fin de semaine -----
function endWeek(S) {

    if (tax > 0) { spend(S, tax); lines.push(`Avertissement-extrait de rôle (impôt de l'année) : −${fmt(tax)} €`); log(S, `Impôt sur les revenus de l'année : ${fmt(tax)} €.`); }

    S.yearIncome = 0;
  }

  if (S.week >= S.trendUntil) { let t; do { t = ri(0, 4); } while (t === S.trend); S.trend = t; S.trendUntil = S.week + 8; trendMsg = `Nouvelle tendance : le ${GENRES[t]} cartonne (+40 % d'écoutes).`; lines.push(trendMsg); }
  // reset semaine

        { l: "Négocier l'avance", f: S => { openNego(S, { kind: "label", who: "Onde Nord Records", base: adv, unit: "€", title: "Avance du label" }); return null; } },
        { l: "Rester indépendant", f: () => "Tu restes indépendant. Tout ce que tu gagnes est à toi." }] };

    if (np === 6 && !S.won) { S.won = true; pend = { t: `${S.name} est désormais une star internationale. Tu as réussi en ${S.week - 1} semaines. Tu peux continuer ta carrière.`, win: true, choices: [{ l: "Continuer", f: () => "La carrière continue." }] }; }

const BEATS = 10, GAP = 950, LEAD = 1300;

  <div class="ch">${ev.choices.map((c, i) => `<button class="cta ${i ? "ghost" : ""}" data-choice="${i}">${esc(c.l)}</button>`).join("")}</div></div></div>`;
}

// ----- Événements de l'interface -----
function after(m) { const g = S ? checkGuide(S) : []; const all = [m, ...g].filter(Boolean); if (all.length) toast(all.join(" · ")); save(); render(); }
document.addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f || S) return;
  setup[f] = e.target.value;
  if (f === "age") { const h = document.querySelector(".setup .hint"); if (h) h.textContent = ageHint(); }
});
document.addEventListener("keydown", e => { if (GIG && !GIG.done && (e.key === " " || e.key === "Enter")) { e.preventDefault(); gigTap(); } });
document.addEventListener("pointerdown", e => { if (e.target.closest("#tap")) { e.preventDefault(); gigTap(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.genre !== undefined) { setup.genre = +d.genre; return renderSetup(); }
  if (d.sexe) { setup.sexe = d.sexe; return renderSetup(); }
  if (b.id === "start") {
    const a = ageVal(), pr = setup.prenom.trim(), n = setup.name.trim(), err = $("#serr");
    const msg = !pr ? "Indique un prénom." : !n ? "Indique un nom de scène." : !(a >= 16 && a <= 45) ? "L'âge doit être entre 16 et 45 ans." : "";
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    S = newState({ prenom: pr, name: n, sexe: setup.sexe, age: a, genre: GENRES[setup.genre] });
    log(S, `${pr}, ${a} ans, se lance dans la musique sous le nom de ${n}.`); tab = "agenda"; return after();
  }
  if (d.tab) { tab = d.tab; confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (d.act) { const m = doAction(S, d.act); if (S.pendingLove) { loveChoice(); } if (S.pendingWed) { S.pendingWed = false; S.pending = weddingChoice(S); modal = { type: "ev", ev: S.pending }; }
  if (S.pendingDocDeal) { S.pendingDocDeal = false; openNego(S, { kind: "doc", who: "Streamix", base: Math.round(S.fans * 0.3 / 1000) * 1000, unit: "€", title: "Droits de ton documentaire" }); modal = { type: "nego" }; }
  if (S.pendingTone) { const k = S.pendingTone; S.pendingTone = null; S.pending = toneChoice(S, k); modal = { type: "ev", ev: S.pending }; } return after(m); }
  if (d.nask !== undefined) { negoAsk(S, +d.nask); return render(); }
  if (d.nend !== undefined) { const m = negoClose(S, d.nend === "1"); modal = S.pending ? { type: "ev", ev: S.pending } : null; return after(m); }
  if (d.wg !== undefined) { const t = $("#stitle").value; writeGenre = +d.wg; render(); $("#stitle").value = t; return; }
  if (d.promo !== undefined) { const t = $("#atitle").value; albumPromo = +d.promo; render(); $("#atitle").value = t; return; }
  if (d.rec) return after(recordSong(S, +d.rec, d.st));
  if (d.rel) return after(releaseSong(S, +d.rel));
  if (d.gig) return startGig({ kind: "gig", id: d.gig, dates: 1 });
  if (d.clip) return after(shootClip(S, +d.clip, d.c));
  if (d.featfor) { modal = { type: "feat", id: +d.featfor }; return render(); }
  if (d.feat !== undefined) { const m = askFeat(S, modal.id, +d.feat); const s = S.songs.find(x => x.id === modal.id); if (s && s.feat) modal = null; return after(m); }
  if (d.sign !== undefined) return after(signProspect(S, +d.sign));
  if (d.asingle !== undefined) return after(artistSingle(S, +d.asingle, +d.b));
  if (d.acoach !== undefined) return after(coachArtist(S, +d.acoach));
  if (d.arenew !== undefined) return after(renewArtist(S, +d.arenew));
  if (d.book !== undefined) { toggleBook(S, +d.book, d.mine === "1"); save(); return render(); }
  if (d.tprice !== undefined) { S.fest.price = +d.tprice; save(); return render(); }
  if (d.ccoach !== undefined) return after(coachCand(S, +d.ccoach));
  if (d.look !== undefined) return after(setLook(S, +d.look));
  if (d.cause !== undefined) { causeSel = +d.cause; return render(); }
  if (d.don) return after(donate(S, +d.don));
  if (d.promo2) return after(promoAbroad(S, d.promo2));
  if (d.tour2) return startGig({ kind: "abroad", id: d.tour2 });
  if (d.tterr) { plan.terr = d.tterr; plan.dates = []; if (!transOk(TERR.find(x => x.id === plan.terr), TRANS.find(x => x.id === plan.trans))) plan.trans = TRANS.find(x => transOk(TERR.find(t => t.id === plan.terr), x)).id; return render(); }
  if (d.ttrans) { plan.trans = d.ttrans; return render(); }
  if (d.tpr !== undefined) { plan.price = +d.tpr; return render(); }
  if (d.tdate) { const k = plan.dates.findIndex(x => x.city === d.tdate); if (k >= 0 && plan.dates[k].v === d.tv) plan.dates.splice(k, 1); else if (k >= 0) plan.dates[k].v = d.tv; else plan.dates.push({ city: d.tdate, v: d.tv }); return render(); }
  if (d.merch !== undefined) return after(buyMerch(S, +d.merch));
  if (d.brand) return after(launchBrand(S, d.brand));
  if (d.inv) return after(invest(S, d.inv, +d.amt || 0));
  if (d.out) return after(withdraw(S, d.out));
  if (d.house !== undefined) return after(moveHouse(S, +d.house));
  if (d.car !== undefined) return after(buyCar(S, +d.car));
  if (d.hire) return after(hire(S, d.hire));
  if (d.fire) return after(fire(S, d.fire));
  if (d.tour) return startGig({ kind: "gig", id: d.tour, dates: 4 });
  if (b.id === "tap") return;
  if (d.gigskip) return endGig(1);
  if (d.gigdone) return endGig(GIG.perf);
  if (d.choice !== undefined) { const c = S.pending.choices[+d.choice]; S.pending = null; const m = c.f(S); if (m) log(S, m); modal = S.nego ? { type: "nego" } : S.pending ? { type: "ev", ev: S.pending } : null; return after(m); }
  switch (d.do) {
    case "week": endWeek(S); modal = { type: "report", r: S.report }; return after();
    case "fandom": return after(setFandom(S, $("#fandom").value));
    case "mklabel": return after(createLabel(S, $("#lname").value));
    case "mkfest": return after(createFest(S, $("#fname").value));
    case "ground": return after(upgradeGround(S));
    case "runfest": return after(runFest(S));
    case "tv": openNego(S, { kind: "tv", who: "La chaîne", base: tvCachet(S), unit: "€ par émission", title: "Cachet de jury" }); modal = { type: "nego" }; return render();
    case "tourgo": plan.name = ($("#tname") || {}).value || ""; return startGig({ kind: "tour" });
    case "tourcancel": confirmCancel ? (confirmCancel = false, after(cancelTour(S))) : (confirmCancel = true, render()); return;
    case "sceno": return after(buySceno(S));
    case "found": return after(createFoundation(S, causeSel));
    case "closefeat": modal = null; return render();
    case "close": modal = S.pending ? { type: "ev", ev: S.pending } : null; save(); return render();
    case "write": { const g = writeGenre === null ? S.genre : GENRES[writeGenre]; return after(writeSong(S, $("#stitle").value, g)); }
    case "album": return after(releaseAlbum(S, albumPromo, $("#atitle").value));
    case "home": return after(buyHome(S));
    case "reset1": confirmReset = true; return render();
    case "reset0": confirmReset = false; return render();
    case "reset2": try { localStorage.removeItem(KEY); } catch (e) {} S = null; modal = null; confirmReset = false; return render();
  }
});

function start(data) {
  S = migrate((data && data.S) || load());
  if (S) S.pending = null;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S: S ? Object.assign({}, S, { pending: null }) : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
